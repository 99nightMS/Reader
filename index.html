<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바코드 생성 및 스캔 모의 UI</title>
  <!-- JsBarcode 라이브러리 (바코드 생성) -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- ZXing 라이브러리 (바코드/QR 스캔) -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 0 auto; padding: 20px; text-align: center; }
    .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; width: 80%; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    video { width: 100%; max-width: 400px; border: 1px solid #333; margin-top: 10px; display: none; }
  </style>
</head>
<body>

  <h2>바코드 모의 테스트 시스템</h2>

  <!-- 1. 바코드 생성 영역 -->
  <div class="card">
    <h3>1. 테스트 바코드 생성</h3>
    <input type="text" id="barcodeInput" value="TEST-123456" placeholder="텍스트 입력">
    <button onclick="generateBarcode()">바코드 생성</button>
    <br>
    <svg id="barcodeCanvas"></svg>
  </div>

  <!-- 2. 바코드 스캔 및 가상 결제 영역 -->
  <div class="card">
    <h3>2. 바코드 스캔 & 결제 시뮬레이션</h3>
    <button onclick="startScanner()">카메라 스캔 시작</button>
    <button onclick="stopScanner()">스캔 중지</button>
    <div>
      <video id="video"></video>
    </div>
    
    <p>스캔 결과: <strong id="scannedResult">없음</strong></p>
    <button id="payBtn" onclick="processMockPayment()" disabled>가상 결제 진행</button>
  </div>

  <script>
    // 1. 바코드 생성 함수
    function generateBarcode() {
      const val = document.getElementById('barcodeInput').value;
      if (!val) return alert('값을 입력하세요.');
      JsBarcode("#barcodeCanvas", val, {
        format: "CODE128",
        width: 2,
        height: 80,
        displayValue: true
      });
    }

    // 초기 화면 바코드 1개 생성
    generateBarcode();

    // 2. 바코드 스캐너 설정
    let codeReader = null;
    let selectedDeviceId = null;

    async function startScanner() {
      const videoElem = document.getElementById('video');
      videoElem.style.display = 'block';

      codeReader = new ZXing.BrowserMultiFormatReader();
      
      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        // 기본적으로 후면 카메라 또는 첫 번째 카메라 선택
        selectedDeviceId = videoInputDevices[0].deviceId;

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
          if (result) {
            document.getElementById('scannedResult').innerText = result.text;
            document.getElementById('payBtn').disabled = false;
            // 스캔 성공 시 카메라는 계속 작동하거나 필요시 stopScanner() 호출
          }
        });
      } catch (err) {
        console.error(err);
        alert('카메라 접근 권한을 확인해 주세요.');
      }
    }

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
        document.getElementById('video').style.display = 'none';
      }
    }

    // 3. 모의 결제 로직 (UI 전용)
    function processMockPayment() {
      const code = document.getElementById('scannedResult').innerText;
      if (code === '없음') return;

      alert(`[모의 결제 완료]\n스캔된 바코드 ID: ${code}\n가상 결제가 성공적으로 처리되었습니다.`);
      
      // Reset
      document.getElementById('scannedResult').innerText = '없음';
      document.getElementById('payBtn').disabled = true;
    }
  </script>
</body>
</html>
